name: sdd-workshop-facilitation
version: 1.0.0
description: >
  Domain and technical skill for the sdd-workshop-boost repository — the SDD (Skill-Driven
  Development) workshop distribution package. Covers the 19 installed skills and what each does,
  the 6 SDD pillars, workshop flow and timing, install system, how to add new skills, how to
  customize for different tech stacks, and common participant questions.

  Trigger phrases: "sdd workshop, workshop facilitation, skill-driven development, workshop skills,
  sdd boost, workshop install, sdd pillars, workshop curriculum, sdd methodology, add workshop skill"

context:
