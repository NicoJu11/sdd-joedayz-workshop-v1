  **Use after:**
  - `comprehensive-workflow-documentation` - Validate workflows after creation
  - `executive-report-generator` - Validate executive updates before sending
  - `workflow-archive-indexing` - Validate indices for accuracy

  **Use with:**
  - `knowledge-infrastructure-management` - Quality gate for knowledge base updates
  - `integrate-assets` - Verify assets properly integrated

  **Typical Flow:**
  1. Create documentation (comprehensive-workflow-documentation)
  2. Create indices (workflow-archive-indexing)
  3. **Validate quality** (this skill - documentation-quality-validation)
  4. Publish/use with confidence

  ---

  ## When to Use This Skill

  **Triggers:**
  - Completed major documentation work (before publication)
  - Preparing documentation for business use (sales, marketing, recruiting)
  - Suspecting documentation drift (metrics out of sync)
  - Before important presentation using documentation
  - Quarterly quality audit of knowledge base

  **Don't use for:**
  - Work-in-progress drafts (wait until complete)
  - Minor updates (1-2 paragraphs changed)
  - Documentation that won't be used externally
  - Personal notes or temporary files

  ---

  ## Success Criteria

  Documentation validation is complete when:
  1. ✅ All metrics consistent across all files
  2. ✅ Word/line counts accurate (not overestimated)
  3. ✅ Technical claims verified against source data
  4. ✅ Terminology used consistently
  5. ✅ All files exist, all cross-references work
  6. ✅ Business value credible and compelling
  7. ✅ Documentation ready for immediate business use

  **Quality Gate:** No critical issues, all issues documented and fixed or waived

